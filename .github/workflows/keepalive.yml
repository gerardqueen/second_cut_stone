# Keeps the free Supabase project awake (free projects pause after about a week with no activity)
# and retries any enquiry alert emails that failed. Runs every 3 days; can also be run by hand
# from the repo's Actions tab → "Keep Supabase awake" → Run workflow.
# Note: GitHub turns off scheduled workflows in public repos after 60 days with no commits;
# it emails a warning first, and one click on "Enable workflow" turns it back on.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping the database
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" js/config.js)
          KEY=$(grep -oP "SUPABASE_ANON_KEY = '\K[^']+" js/config.js)
          curl -fsS "$URL/rest/v1/edge_finishes?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
          echo
      - name: Retry any unsent enquiry alerts
        run: |
          URL=$(grep -oP "SUPABASE_URL = '\K[^']+" js/config.js)
          curl -sS -X POST "$URL/functions/v1/enquiry-alert" -H "Content-Type: application/json" -d '{}' || true
          echo
